name: wms_flutter
description: "WMS Flutter - Warehouse Management System Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Package utama yang dibutuhkan aplikasi saat berjalan
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  fl_chart: ^0.70.2

# Package pendukung khusus untuk development/tools
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1 # [REVISI]: Wajib dimasukkan di sini agar bisa di-run terminal

# Konfigurasi pembuatan icon aplikasi (Android, Web, Windows, iOS)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png" # Lokasi gambar logo aplikasi Anda
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48

# Asset dan resource bawaan Flutter
flutter:
  uses-material-design: true

  # [REVISI]: Mendaftarkan folder assets/images agar logo bisa dipanggil di kode Flutter
  assets:
    - assets/images/